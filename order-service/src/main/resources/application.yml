spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: <username>
    password: <password>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: a-string-secret-at-least-256-bits-long

cart:
  service:
    url: http://localhost:8083

product:
  service:
    url: http://localhost:8082

payment:
  service:
    url: http://localhost:8085